formatVersion: 1
inputs:
  target_port:
    type: integer
    title: Target Port
    description: Destination port for insecure communications
    default: 80
  app_prefix:
    type: string
    title: Application Prefix
    description: Prefix to identify application components
  certificate_name:
    type: string
    title: Certificate Secret
    description: Name of the Kubernetes TLS secret containing the certificate
    enum:
      - wildcard-ecc
      - wildcard-rsa
      - system-default
    default: system-default
resources:
  CCI_Supervisor_Namespace_1:
    type: CCI.Supervisor.Namespace
    properties:
      name: <NAMESPACE_NAME>  ## SANITIZED: Replace with your supervisor namespace name
      existing: true
  Username_Secret:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${input.app_prefix}-bootstrap-secret
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        stringData:
          aviuser-passwd: <PASSWORD_HASH>  #SANITIZED: Replace with your password hash (use mkpasswd or similar)
  Virtual_Machine_2:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${input.app_prefix}-vm2
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
          labels:
            vm-selector: ${input.app_prefix}-vm2
            vm-lb-selector: ${input.app_prefix}-lb
        spec:
          className: best-effort-medium
          imageName: <VM_IMAGE_ID>  ##  SANITIZED: Replace with your VM image ID from content library
          storageClass: <STORAGE_POLICY_NAME>  # SANITIZED: Replace with your storage policy name
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt update
                  - /usr/bin/apt-get install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: aviuser
                    passwd:
                      name: ${input.app_prefix}-bootstrap-secret
                      key: aviuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
  Virtual_Machine_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${input.app_prefix}-vm1
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
          labels:
            vm-selector: ${input.app_prefix}-vm2
            vm-lb-selector: ${input.app_prefix}-lb
        spec:
          className: best-effort-medium
          imageName: <VM_IMAGE_ID>  # SANITIZED: Replace with your VM image ID from content library
          storageClass: <STORAGE_POLICY_NAME>  # SANITIZED: Replace with your storage policy name
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt update
                  - /usr/bin/apt-get install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: aviuser
                    passwd:
                      name: ${input.app_prefix}-bootstrap-secret
                      key: aviuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
  VM_Service:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachineService
        metadata:
          name: ${input.app_prefix}-lb
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        spec:
          selector:
            vm-lb-selector: ${input.app_prefix}-lb
          type: ClusterIP  # Needs to be cluster IP for layer 7
          ports:
            - name: http
              protocol: TCP
              port: 80
              targetPort: ${input.target_port}
      wait:
        conditions:
          - type: NonExistentCondition
            status: 'True'
            indicatesFailure: true
  Avi_Ingress:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${input.app_prefix}-ingress
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        spec:
          tls:
            - hosts:
                - ${input.app_prefix}-web.<DOMAIN>  # SANITIZED: Replace <DOMAIN> with your DNS domain
              secretName: ${input.certificate_name}
          rules:
            - host: ${input.app_prefix}-web.<DOMAIN>  # SANITIZED: Replace <DOMAIN> with your DNS domain
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${input.app_prefix}-lb
                        port:
                          number: 80
