formatVersion: 1
inputs:
  target_port:
    type: integer
    title: Target Port
    description: Destination port for insecure communications
    default: 80
  app_prefix:
    type: string
    title: Application Name
    description: Prefix to identify application components
  os:
    type: string
    title: Operating System
    description: OS to deploy
    enum:
      - Ubuntu
      - Debian
      - Photon
  app_user:
    type: string
    title: Application Username
    description: Username for logging into the server
  app_password:
    type: string
    title: Application Password
    encrypted: true
    writeOnly: true
resources:
  CCI_Supervisor_Namespace_1:
    type: CCI.Supervisor.Namespace
    properties:
      name: <NAMESPACE_NAME>  # SANITIZED: Replace with your supervisor namespace name
      existing: true
  Secret_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${input.app_prefix}-bootstrap-secret
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        stringData:
          aviuser-passwd: <PASSWORD_HASH>  # SANITIZED: Replace with your password hash (use mkpasswd or similar)
  VM_1:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Secret_1
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${input.app_prefix}-vm1
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
          labels:
            vm-selector: ${input.app_prefix}-vm2
            vm-lb-selector: ${input.app_prefix}-lb
        spec:
          className: best-effort-medium
          imageName: vmi-a6830bf9e2597e2e4
          storageClass: management-storage-policy-thin
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt update
                  - /usr/bin/apt-get install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: aviuser
                    passwd:
                      name: ${input.app_prefix}-bootstrap-secret
                      key: aviuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
  VM_2:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Secret_1
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${input.app_prefix}-vm2
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
          labels:
            vm-selector: ${input.app_prefix}-vm2
            vm-lb-selector: ${input.app_prefix}-lb
        spec:
          className: best-effort-medium
          imageName: vmi-a6830bf9e2597e2e4
          storageClass: management-storage-policy-thin
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt update
                  - /usr/bin/apt-get install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: aviuser
                    passwd:
                      name: ${input.app_prefix}-bootstrap-secret
                      key: aviuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
  Avi_Pool_1:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VM_1
      - VM_2
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachineService
        metadata:
          name: ${input.app_prefix}-lb
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        spec:
          selector:
            vm-lb-selector: ${input.app_prefix}-lb
          type: ClusterIP
          ports:
            - name: http
              protocol: TCP
              port: 80
              targetPort: ${input.target_port}
      wait:
        conditions:
          - type: NonExistentCondition
            status: 'True'
            indicatesFailure: true
  Avi_VirtualService_1:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Avi_Pool_1
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${input.app_prefix}-ingress
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        spec:
          rules:
            - host: ${input.app_prefix}-web.<DOMAIN>  # SANITIZED: Replace <DOMAIN> with your DNS domain
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${input.app_prefix}-lb
                        port:
                          number: 80
